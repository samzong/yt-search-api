name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify SemVer tag and package.json
        id: meta
        run: bash scripts/check-release-tag.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test --runInBand
      - run: yarn build

      - name: Find previous stable release
        id: notes
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' --exclude "$RELEASE_TAG")"
          printf 'base=%s\n' "$(git rev-parse "$previous^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.1
          args: --ignore-tags=.* --tag ${{ env.RELEASE_TAG }} ${{ steps.notes.outputs.base }}..HEAD --strip all --output release-notes.md

      - name: Verify CHANGELOG.md
        run: node scripts/check-release-notes.cjs

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
